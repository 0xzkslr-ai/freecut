[package]
name = "freecut"
version = "0.2.0"
description = "Freehand and polygon screenshots with transparent edges"
authors = ["FreeCut contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "freecut_lib"
path = "src/lib.rs"

[[bin]]
name = "FreeCut"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "native_probe"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "dep:rfd"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
png = "0.18"
tempfile = "3"
rustfft = { version = "6.4", default-features = false, features = ["sse"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rfd = { version = "0.17", default-features = false, optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
