[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freecut"
version = "0.1.0"
description = "Offline desktop screenshots with freehand and polygon selections"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PySide6-Essentials>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]
bundle = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
freecut = "freecut.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=freecut --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["src/freecut/__main__.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
