name: Checks
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test portable image and settings core
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Check portable image and settings core
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npm run build
        if: runner.os == 'Windows'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: runner.os == 'Windows'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
        if: runner.os == 'Windows'
      - run: node scripts/licenses.mjs
        if: runner.os == 'Windows'
      - run: npm run tauri -- build
        if: runner.os == 'Windows'
      - run: node scripts/package-portable.mjs
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FreeCut-windows-x64
          path: |
            dist/FreeCut-Tauri/
            src-tauri/target/release/bundle/nsis/*-setup.exe
